<!doctype html>
<html>
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Progress Dashboard (Teacher)</title>
  <style>
    :root{ --ink:#111827; --muted:#6b7280; --card:#fff; --bg:#f8fafc; }
    body{ font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial; color:var(--ink); background:var(--bg); margin:0;}
    header{ padding:12px 16px; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.06); position:sticky; top:0; z-index:10;}
    main{ padding:16px; max-width:1200px; margin:auto;}
    input[type="search"]{ padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; }
    .muted{ color:var(--muted); }
    .cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:12px; margin-top:12px;}
    .card{ background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05);}
    .chip{ display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; }
    .trend-up{ color:#0b8043; } .trend-flat{ color:#6b7280; } .trend-down{ color:#b00020; }
    table{ width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:12px;}
    th{ text-align:left; font-size:12px; color:var(--muted); padding:0 8px;}
    td{ background:var(--card); padding:10px 8px; vertical-align:top;}
    tr td:first-child{ border-radius:10px 0 0 10px;}
    tr td:last-child{ border-radius:0 10px 10px 0;}
    .bar{ height:8px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
    .bar>div{ height:100%; background:linear-gradient(90deg,#d1d5db,#93c5fd,#86efac);}
    .btn{ padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; cursor:pointer; }
    .topic-wrap { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <header>
    <strong>Progress Dashboard — Teacher</strong>
    <input id="q" type="search" placeholder="Search email…" style="margin-left:12px">
    <span id="stats" class="muted" style="margin-left:8px"></span>
  </header>

  <main>
    <div id="cards" class="cards"></div>

    <table id="grid">
      <thead>
        <tr>
          <th style="width:28%">Email</th>
          <th>Topics summary</th>
          <th style="width:18%">% completion</th>
          <th style="width:16%">Report</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    let DATA=null;
    const badge = (t) => t==="up" ? "<span class='trend-up'>📈 up</span>" : t==="down" ? "<span class='trend-down'>📉 down</span>" : "<span class='trend-flat'>▬ flat</span>";
    function pctLevelsFromArray(levelsArr, idList){
      // Use caps by activity from DATA.id2meta
      let tot=0, max=0;
      levelsArr.forEach((lvl, i)=>{
        const id=idList[i]; const cap = DATA.id2meta[id]?.maxIdx ?? 3;
        const val = Math.min(({"none":0,"root":1,"plant":2,"tree":3}[lvl]||0), cap);
        tot += val; max += cap;
      });
      return max ? Math.round(100*tot/max) : 0;
    }

    function drawCards(){
      const host=document.getElementById('cards'); host.innerHTML='';
      DATA.topics.forEach(t=>{
        const c=DATA.countsByTopic[t.name] || {class:{}, hw:{}};
        const tr = (DATA.trends.perTopic && DATA.trends.perTopic[t.name]) || "flat";
        const el=document.createElement('div'); el.className='card';
        el.innerHTML=`
          <div class="topic-wrap"><strong>${t.name}</strong><span>${badge(tr)}</span></div>
          <div class="muted" style="margin-top:6px">Classwork</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px">
            <span class="chip">⚪ none: ${c.class?.none||0}</span>
            <span class="chip">🌱 root: ${c.class?.root||0}</span>
            <span class="chip">🌿 plant: ${c.class?.plant||0}</span>
            <span class="chip">🌳 tree: ${c.class?.tree||0}</span>
          </div>
          <div class="muted" style="margin-top:6px">Homework</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px">
            <span class="chip">⚪ none: ${c.hw?.none||0}</span>
            <span class="chip">🌱 root: ${c.hw?.root||0}</span>
            <span class="chip">🌿 plant: ${c.hw?.plant||0}</span>
            <span class="chip">🌳 tree: ${c.hw?.tree||0}</span>
          </div>`;
        host.appendChild(el);
      });
    }

    function drawTable(){
      const q=(document.getElementById('q').value||'').toLowerCase();
      const tbody=document.querySelector('#grid tbody'); tbody.innerHTML='';
      const rows = DATA.rows.filter(r=> r.email.toLowerCase().includes(q)).sort((a,b)=> a.email.localeCompare(b.email));
      document.getElementById('stats').textContent = `Showing ${rows.length}/${DATA.rows.length} students`;

      const id2topic = {}; DATA.topics.forEach(t => t.items.forEach(it => { id2topic[it.id] = {topic:t.name, id:it.id}; }));

      rows.forEach(r=>{
        const buckets = {}; // topic -> {levels:[], ids:[]}
        Object.entries(r.levelsById).forEach(([id, lvl])=>{
          const t = id2topic[id]?.topic; if (!t) return;
          (buckets[t] ||= {levels:[], ids:[]});
          buckets[t].levels.push(lvl); buckets[t].ids.push(id);
        });

        const tr=document.createElement('tr');
        const tdEmail = `<td class="muted">${r.email}</td>`;
        const topicBlocks = Object.keys(buckets).sort().map(t=>{
          const pct = pctLevelsFromArray(buckets[t].levels, buckets[t].ids);
          const tTrend = (DATA.trends.perTopic && DATA.trends.perTopic[t]) || "flat";
          return `
            <div style="margin-bottom:10px">
              <strong>${t}</strong> — ${badge(tTrend)}
              <div class="bar" style="margin-top:4px"><div style="width:${pct}%"></div></div>
              <div class="muted" style="font-size:12px;margin-top:2px">${pct}%</div>
            </div>`;
        }).join('');
        const tdTopics = `<td>${topicBlocks}</td>`;
        const tdPct = `<td><div class="bar"><div style="width:${r.completion}%"></div></div><div class="muted" style="font-size:12px;margin-top:4px">${r.completion}%</div></td>`;
        const tdActions = `<td><button class="btn" data-mail="${r.email}" data-open="report">Open report</button></td>`;

        tr.innerHTML = tdEmail + tdTopics + tdPct + tdActions;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('button[data-open="report"]').forEach(btn=>{
        btn.onclick = ()=>{
          const mail = btn.getAttribute('data-mail');
          const url = `?page=report&email=${encodeURIComponent(mail)}`;
          window.open(url, '_blank');
        };
      });
    }

    function init(data){ DATA=data; drawCards(); drawTable(); document.getElementById('q').oninput = drawTable; }
    function ensureLoginOrExplain(err){
      const msg = (err && (err.message || err.toString())) || "";
      if (msg.indexOf("__NO_IDENTITY__") !== -1) {
        window.top.location.href = "https://accounts.google.com/AccountChooser?continue=" + encodeURIComponent(window.location.href);
        return;
      }
      alert('Failed to load teacher data.');
    }

    google.script.run.withSuccessHandler(init).withFailureHandler(ensureLoginOrExplain).getTeacherData();
  </script>
</body>
</html>
