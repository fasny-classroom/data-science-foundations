[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "report"
version = "0.1.0"
description = "Simple Colab classroom utilities (Done button, etc.)"
authors = [
    { name = "Nadege LEMPERIERE", email = "nlemperiere@fasny.org" }
]
readme = "class-advancement/README.md"
license = { text = "MIT" }  # or whatever you prefer
requires-python = ">=3.8"
dependencies = [
    "ipywidgets>=8.0.0"
]

[project.urls]
Homepage = "https://github.com/fasny-classroom/data-science-foundations"
