<!doctype html>
<html>
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Class Progress (Anonymized)</title>
  <style>
    :root{ --ink:#111827; --muted:#6b7280; --card:#fff; --bg:#f8fafc; }
    body{ font:14px system-ui,-apple-system,Segoe UI,Roboto; color:var(--ink); background:var(--bg); margin:0;}
    header{ padding:12px 16px; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.06); position:sticky; top:0;}
    main{ padding:16px; max-width:1100px; margin:auto;}
    .muted{ color:var(--muted); }
    .cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:12px; margin-top:12px;}
    .card{ background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05);}
    .chip{ display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; }
    .trend-up{ color:#0b8043; } .trend-flat{ color:#6b7280; } .trend-down{ color:#b00020; }
    .hstack{ display:flex; gap:8px; flex-wrap:wrap;}
  </style>
</head>
<body>
  <header><strong>Class Progress — Anonymized</strong></header>
  <main>
    <div id="comp" class="card"></div>
    <div id="cards" class="cards"></div>
  </main>
  <script>
    const badge=t=> t==="up"?"<span class='trend-up'>📈 up</span>": t==="down"?"<span class='trend-down'>📉 down</span>":"<span class='trend-flat'>▬ flat</span>";
    function draw(data){
      const comp=document.getElementById('comp');
      const b=data.completionBuckets;
      comp.innerHTML = `<div><strong>Completion distribution</strong></div>
        <div class="hstack" style="margin-top:8px">
          <span class="chip">0–25%: ${b["0–25%"]||0}</span>
          <span class="chip">26–50%: ${b["26–50%"]||0}</span>
          <span class="chip">51–75%: ${b["51–75%"]||0}</span>
          <span class="chip">76–100%: ${b["76–100%"]||0}</span>
        </div>`;
      const host=document.getElementById('cards'); host.innerHTML='';
      data.topics.forEach(t=>{
        const c=data.countsByTopic[t.name] || {class:{}, hw:{}};
        const trend = (data.trends.perTopic && data.trends.perTopic[t.name]) || "flat";
        const el=document.createElement('div'); el.className='card';
        el.innerHTML=`
          <div><strong>${t.name}</strong> — ${badge(trend)}</div>
          <div class="muted" style="margin-top:6px">Classwork</div>
          <div class="hstack" style="margin-top:4px">
            <span class="chip">⚪ none: ${c.class?.none||0}</span>
            <span class="chip">🌱 root: ${c.class?.root||0}</span>
            <span class="chip">🌿 plant: ${c.class?.plant||0}</span>
            <span class="chip">🌳 tree: ${c.class?.tree||0}</span>
          </div>
          <div class="muted" style="margin-top:6px">Homework</div>
          <div class="hstack" style="margin-top:4px">
            <span class="chip">⚪ none: ${c.hw?.none||0}</span>
            <span class="chip">🌱 root: ${c.hw?.root||0}</span>
            <span class="chip">🌿 plant: ${c.hw?.plant||0}</span>
            <span class="chip">🌳 tree: ${c.hw?.tree||0}</span>
          </div>`;
        host.appendChild(el);
      });
    }
    google.script.run.withSuccessHandler(draw).withFailureHandler(e=>{console.error(e); alert('Failed to load.');}).getAnonData();
  </script>
</body>
</html>
