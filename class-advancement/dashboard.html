<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Dashboard</title>
  <style>
    :root{ --ink:#111827; --muted:#6b7280; --card:#ffffff; --bg:#f8fafc; }
    body{ font:14px system-ui, -apple-system, Segoe UI, Roboto, Arial; color:var(--ink); background:var(--bg); margin:0; }
    header{ padding:12px 16px; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.06); position:sticky; top:0; z-index:10; }
    main{ padding:16px; max-width:1100px; margin:auto; }

    .controls{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    input[type="search"], select{ padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; }
    .muted{ color:var(--muted); }

    .cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:12px; margin-top:12px; }
    .card{ background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
    .chip{ display:inline-block; padding:2px 8px; border-radius:999px; background:#eef2ff; }

    table{ width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:12px; }
    th{ text-align:left; font-size:12px; color:var(--muted); padding:0 8px; }
    td{ background:var(--card); padding:10px 8px; }
    tr td:first-child{ border-radius:10px 0 0 10px; }
    tr td:last-child{ border-radius:0 10px 10px 0; }

    .bar{ height:8px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
    .bar > div{ height:100%; background:linear-gradient(90deg, #d1d5db, #93c5fd, #86efac); }
  </style>
</head>
<body>
  <header>
    <div class="controls">
      <strong>Progress Dashboard</strong>
      <input id="q" type="search" placeholder="Search email…" />
      <label>Highlight:
        <select id="asg"></select>
      </label>
      <label>Min level:
        <select id="minlvl">
          <option value="">(any)</option>
        </select>
      </label>
      <span id="stats" class="muted"></span>
    </div>
  </header>

  <main>
    <div class="cards" id="cards"></div>

    <table id="grid">
      <thead>
        <tr>
          <th style="width:28%">Email</th>
          <th>Assignments</th>
          <th style="width:14%">Progress</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    // Filled from server
    let DATA = null;
    let EMOJI = {none:"⚪", root:"🌱", plant:"🌿", tree:"🌳"};
    let ORDER = {none:0, root:1, plant:2, tree:3};

    function pct(rec){
      const max = 3; // none..tree
      const sum = rec.levels.reduce((s,l)=> s + (ORDER[l] || 0), 0);
      return Math.round(100 * sum / (DATA.assignments.length * max));
    }

    function drawCards(){
      const cards = document.getElementById("cards");
      cards.innerHTML = "";
      DATA.assignments.forEach(a => {
        const c = DATA.counts[a];
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
          <div><strong>${a}</strong></div>
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap">
            <span class="chip">${EMOJI.none} start: ${c.none}</span>
            <span class="chip">${EMOJI.root} root: ${c.root}</span>
            <span class="chip">${EMOJI.plant} plant: ${c.plant}</span>
            <span class="chip">${EMOJI.tree} tree: ${c.tree}</span>
          </div>
        `;
        cards.appendChild(el);
      });
    }

    function drawTable(){
      const tbody = document.querySelector("#grid tbody");
      tbody.innerHTML = "";

      const q = (document.getElementById("q").value || "").toLowerCase();
      const asg = document.getElementById("asg").value;
      const minlvl = document.getElementById("minlvl").value;

      const rows = DATA.rows.filter(r => {
        const hit = r.email.toLowerCase().includes(q);
        if (!hit) return false;
        if (minlvl){
          const meets = r.levels.some(l => (ORDER[l] ?? 0) >= (ORDER[minlvl] ?? 0));
          if (!meets) return false;
        }
        return true;
      });

      document.getElementById("stats").textContent = `Showing ${rows.length}/${DATA.rows.length} students`;

      rows.sort((a,b)=> a.email.localeCompare(b.email));
      rows.forEach(r => {
        const tr = document.createElement("tr");

        const tdEmail = `<td class="muted">${r.email||""}</td>`;

        const chips = DATA.assignments.map((k, idx) => {
          const v = r.levels[idx] || "none";
          const label = `${EMOJI[v]}`;
          const outline = (asg && k===asg) ? "outline:2px solid #6366f1; outline-offset:2px;" : "";
          return `<span style="margin-right:6px; ${outline}">${k}:${label}</span>`;
        }).join("");
        const tdAsg = `<td>${chips}</td>`;

        const p = r.progress ?? pct(r);
        const tdProg = `<td><div class="bar"><div style="width:${p}%"></div></div><div class="muted" style="font-size:12px;margin-top:4px">${p}%</div></td>`;

        tr.innerHTML = tdEmail + tdAsg + tdProg;
        tbody.appendChild(tr);
      });
    }

    function drawAll(){ drawCards(); drawTable(); }

    function init(data){
      DATA = data;
      EMOJI = data.emoji || EMOJI;
      ORDER = { none:0, root:1, plant:2, tree:3 };

      // Populate filters
      const selAsg = document.getElementById("asg");
      selAsg.innerHTML = `<option value="">(none)</option>` + DATA.assignments.map(a=>`<option value="${a}">${a}</option>`).join("");

      const selMin = document.getElementById("minlvl");
      selMin.innerHTML = `
        <option value="">(any)</option>
        <option value="none">start</option>
        <option value="root">root</option>
        <option value="plant">plant</option>
        <option value="tree">tree</option>
      `;

      // Wire controls
      document.getElementById("q").oninput = drawAll;
      document.getElementById("asg").onchange = drawAll;
      document.getElementById("minlvl").onchange = drawAll;

      drawAll();
    }

    // Fetch & render
    google.script.run.withSuccessHandler(init).withFailureHandler(err => {
      console.error(err);
      alert('Failed to load dashboard data.');
    }).getDashboardData();
  </script>
</body>
</html>
