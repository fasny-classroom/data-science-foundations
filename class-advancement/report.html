<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress Report</title>
  <style>
    :root{ --ink:#111827; --muted:#6b7280; --card:#ffffff; }
    @media print { .noprint { display:none !important; } body { margin: 12mm; } }
    body{ font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial; color:var(--ink); background:#fff; margin:16px; }
    h1{ font-size:18px; margin:0 0 6px; }
    h2{ font-size:15px; margin:14px 0 6px; }
    ul{ margin:6px 0 12px 18px; }
    .muted{ color:var(--muted); }
    .badge{ display:inline-block; padding:2px 8px; border:1px solid #e5e7eb; border-radius:999px; }
    .card{ background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); margin-bottom:12px; }
    .table{ width:100%; border-collapse:collapse; margin-top:8px;}
    .table th, .table td{ border:1px solid #e5e7eb; padding:6px 8px; font-size:12px; }
  </style>
</head>
<body>
  <div class="noprint" style="margin-bottom:12px">
    <button onclick="window.print()" style="padding:6px 10px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; cursor:pointer;">Print / Save as PDF</button>
  </div>

  <h1>Progress report — <?= data.email ?></h1>
  <div>Overall completion: <span class="badge"><?= data.completion ?>%</span></div>
  <div class="muted" style="margin:6px 0 12px">
    Legend: <?= data.emoji.none ?> none · <?= data.emoji.root ?> root · <?= data.emoji.plant ?> plant · <?= data.emoji.tree ?> tree
  </div>

  <!-- Curve first (order-based) -->
  <div class="card">
    <div><strong>Progress by assignment order</strong></div>
    <div id="chart"></div>
  </div>

  <!-- Durations -->
  <div class="card">
    <div><strong>Time to level up</strong></div>
    <div id="durations"></div>
  </div>

  <!-- Then details by topic -->
  <? for (var i=0;i<data.topics.length;i++){ var t=data.topics[i]; ?>
    <div class="card">
      <h2><?= t.name ?></h2>
      <ul>
        <? for (var j=0;j<t.items.length;j++){ var it=t.items[j]; ?>
          <li><strong><?= it.activity ?></strong> [<?= it.mode ?>, order <?= it.order ?>] — <?= data.emoji[it.level] ?> <?= it.level ?> (max <?= ["none","root","plant","tree"][it.maxIdx] ?>)</li>
        <? } ?>
      </ul>
    </div>
  <? } ?>

  <div class="muted">Generated <?= (new Date()).toLocaleString() ?></div>

  <script>
    (function(){
      const series = <?= JSON.stringify(data.series) ?>;
      const host=document.getElementById('chart');
      if (!series || !series.length){ host.innerHTML='<div class="muted">No data.</div>'; }
      else {
        const W=900, H=240, P=36;
        const xMin = Math.min.apply(null, series.map(p=>p.order)), xMax = Math.max.apply(null, series.map(p=>p.order));
        const sx=x=> P + (xMax-xMin ? ((x-xMin)/(xMax-xMin))*(W-2*P) : 0);
        const sy=y=> H-P - ((y-0)/(100-0))*(H-2*P);
        const S=series.slice().sort((a,b)=> a.order-b.order);
        const d = S.map(p=> `${sx(p.order)},${sy(p.pct)}`).join(' ');
        const xTicks = Array.from(new Set(S.map(p=>p.order))).sort((a,b)=>a-b);
        const yTicks=[0,25,50,75,100];
        const gridY = yTicks.map(v=> `<line x1="${P}" y1="${sy(v)}" x2="${W-P}" y2="${sy(v)}" stroke="#e5e7eb"/>`).join('');
        const labelsY = yTicks.map(v=> `<text x="${P-6}" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="#6b7280">${v}%</text>`).join('');
        const labelsX = xTicks.map(v=> `<text x="${sx(v)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b7280">${v}</text>`).join('');
        const circles = S.map(p=> `<circle cx="${sx(p.order)}" cy="${sy(p.pct)}" r="3" fill="#111827"><title>${p.activity} [${p.mode}] → ${p.pct}% @ order ${p.order}</title></circle>`).join('');
        host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="280">
          <rect x="0" y="0" width="${W}" height="${H}" fill="#fff" rx="12" ry="12"></rect>
          ${gridY}${labelsY}${labelsX}
          <polyline fill="none" stroke="#111827" stroke-width="2" points="${d}"></polyline>
          ${circles}
        </svg>`;
      }

      // Durations table
      const D = <?= JSON.stringify(data.durations||[]) ?>;
      const area=document.getElementById('durations');
      if (!D.length){ area.innerHTML='<div class="muted">No history yet.</div>'; }
      else {
        const header = `
          <tr>
            <th>Order</th><th>Topic</th><th>Activity</th><th>Mode</th>
            <th>Root date</th><th>Plant date</th><th>Tree date</th>
            <th>Days root→plant</th><th>Days plant→tree</th>
          </tr>`;
        const body = D.map(r=>`
          <tr>
            <td>${r.order}</td><td>${r.topic}</td><td>${r.activity}</td><td>${r.mode}</td>
            <td>${r.root||""}</td><td>${r.plant||""}</td><td>${r.tree||""}</td>
            <td>${r.d_root_plant==null?"—":r.d_root_plant}</td>
            <td>${r.d_plant_tree==null?"—":r.d_plant_tree}</td>
          </tr>`).join('');
        area.innerHTML = `<table class="table">${header}${body}</table>`;
      }
    }());
  </script>
</body>
</html>
